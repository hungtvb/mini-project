name: Nexcent Refactor CI

on:
  push:
    branches:
      - refactor/nexcent-ui-boundary
  pull_request:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: nexcent-refactor-${{ github.ref }}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Refresh cross-platform lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh cross-platform workspace lockfile"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared UI
        run: npm run typecheck --workspace @nexcent/ui

      - name: Typecheck landing integration
        run: npm run typecheck --workspace @nexcent/landing-elements

      - name: Run landing tests
        run: npm test --workspace @nexcent/landing-elements

      - name: Build landing integration
        run: npm run build --workspace @nexcent/landing-elements

      - name: Build Storybook
        run: npm run build-storybook --workspace @nexcent/landing-elements
