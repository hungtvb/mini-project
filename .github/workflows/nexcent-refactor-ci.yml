name: Nexcent Refactor CI

on:
  push:
    branches:
      - refactor/nexcent-ui-boundary
  pull_request:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: nexcent-refactor-${{ github.ref }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared UI
        run: npm run typecheck --workspace @nexcent/ui

      - name: Typecheck landing integration
        run: npm run typecheck --workspace @nexcent/landing-elements

      - name: Run landing tests
        run: npm test --workspace @nexcent/landing-elements

      - name: Build landing integration
        run: npm run build --workspace @nexcent/landing-elements

      - name: Build Storybook
        run: npm run build-storybook --workspace @nexcent/landing-elements

  full-setup-smoke:
    name: DXP 2026.Q2.8 full setup smoke
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0

      - name: Resolve Nexcent runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          product=$(awk -F= '/^liferay.workspace.product=/{print $2}' gradle.properties | xargs)
          if [[ "$product" != "dxp-2026.q2.8" ]]; then
            echo "Expected liferay.workspace.product=dxp-2026.q2.8, found: $product"
            exit 1
          fi

          web_id=$(awk -F= '/^nexcent.fragments.company.web.id=/{print $2}' gradle.properties | xargs)
          if [[ -z "$web_id" ]]; then
            web_id="nexcent.com"
          fi

          echo "LIFERAY_PRODUCT=$product" >> "$GITHUB_ENV"
          echo "NEXCENT_WEB_ID=$web_id" >> "$GITHUB_ENV"
          echo "LIFERAY_BASE_URL=http://$web_id:8080" >> "$GITHUB_ENV"
          echo "LIFERAY_ADMIN_EMAIL=admin@$web_id" >> "$GITHUB_ENV"
          echo "NO_PROXY=localhost,127.0.0.1,$web_id" >> "$GITHUB_ENV"
          echo "no_proxy=localhost,127.0.0.1,$web_id" >> "$GITHUB_ENV"

          echo "Product: $product"
          echo "Company web ID: $web_id"

      - name: Inventory current setup assets
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Client extensions ==='
          find client-extensions -maxdepth 4 -type f \
            \( -name 'client-extension.yaml' -o -name '*.batch-engine-data.json' \) \
            -print | sort

          echo '=== OSGi modules ==='
          find modules -maxdepth 6 -type f \
            \( -name 'bnd.bnd' -o -name 'service.xml' -o -name 'rest-config.yaml' \) \
            -print | sort

          echo '=== Metric seed references ==='
          grep -R --line-number --fixed-strings 'NXC_METRIC_MEMBERS' \
            client-extensions modules || true

      - name: Install workspace dependencies
        run: npm ci

      - name: Initialize clean Liferay DXP 2026.Q2.8 bundle
        run: |
          chmod +x gradlew
          ./gradlew initBundle --no-daemon --stacktrace

      - name: Configure unattended Nexcent company
        shell: bash
        run: |
          set -euo pipefail

          echo "127.0.0.1 $NEXCENT_WEB_ID" | sudo tee -a /etc/hosts

          cat > bundles/portal-ext.properties <<EOF
          company.default.locale=en_US
          company.default.name=Nexcent
          company.default.web.id=$NEXCENT_WEB_ID
          company.security.auth.type=emailAddress
          company.security.strangers=false
          default.admin.email.address.prefix=admin
          default.admin.first.name=Nexcent
          default.admin.last.name=Admin
          default.admin.password=learn
          default.admin.screen.name=nexcentadmin
          setup.wizard.enabled=false
          terms.of.use.required=false
          users.reminder.queries.enabled=false
          EOF

          mkdir -p build/nexcent-full-setup/config
          cp bundles/portal-ext.properties build/nexcent-full-setup/config/
          cp gradle.properties build/nexcent-full-setup/

      - name: Build and stage complete workspace
        run: |
          ./gradlew deploy --no-daemon --stacktrace

          echo '=== Files staged for Liferay deployment ==='
          find bundles/deploy -maxdepth 2 -type f -print | sort | tee staged-deploy-files.txt

          mkdir -p build/nexcent-full-setup/deploy
          cp -R bundles/deploy/. build/nexcent-full-setup/deploy/
          cp staged-deploy-files.txt build/nexcent-full-setup/

      - name: Start Liferay
        run: |
          nohup env \
            JAVA_OPTS='-Xms1g -Xmx3g -Dfile.encoding=UTF-8 -Duser.timezone=UTC' \
            bundles/tomcat/bin/catalina.sh run > liferay-runtime.log 2>&1 &
          echo $! > liferay-runtime.pid

      - name: Wait for portal startup
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 240); do
            if ! kill -0 "$(cat liferay-runtime.pid)" 2>/dev/null; then
              echo 'Liferay process exited before startup.'
              tail -n 400 liferay-runtime.log
              exit 1
            fi

            status=$(curl --noproxy '*' --silent --output /dev/null \
              --write-out '%{http_code}' \
              "$LIFERAY_BASE_URL/c/portal/login" || true)

            if [[ "$status" == '200' || "$status" == '302' || "$status" == '303' ]]; then
              echo "Liferay is accepting HTTP requests with status $status."
              exit 0
            fi

            if (( attempt % 12 == 0 )); then
              echo "Still waiting for Liferay (attempt $attempt, HTTP $status)..."
              tail -n 60 liferay-runtime.log || true
            fi

            sleep 10
          done

          echo 'Timed out waiting for Liferay.'
          tail -n 500 liferay-runtime.log
          exit 1

      - name: Wait for Nexcent deployments
        shell: bash
        run: |
          set -euo pipefail

          runtime_paths=(
            '/o/nexcent-react-runtime/index.js'
            '/o/nexcent-landing-elements/index.js'
          )

          for attempt in $(seq 1 180); do
            runtime_ready=false

            for path in "${runtime_paths[@]}"; do
              if curl --noproxy '*' --fail --silent --show-error \
                "$LIFERAY_BASE_URL$path" --output nexcent-runtime.js; then
                if grep -q 'nexcent-react-header' nexcent-runtime.js; then
                  echo "NEXCENT_RUNTIME_URL=$LIFERAY_BASE_URL$path" >> "$GITHUB_ENV"
                  runtime_ready=true
                  break
                fi
              fi
            done

            captcha_status=$(curl --noproxy '*' --silent --output captcha.json \
              --write-out '%{http_code}' \
              "$LIFERAY_BASE_URL/o/captcha/v1.0/captcha/challenge" || true)

            metrics_status=$(curl --noproxy '*' --silent --output metrics.json \
              --write-out '%{http_code}' \
              --user "$LIFERAY_ADMIN_EMAIL:learn" \
              "$LIFERAY_BASE_URL/o/c/nxcmetricssnapshots?pageSize=20" || true)

            if [[ "$runtime_ready" == 'true' && "$captcha_status" == '200' && "$metrics_status" == '200' ]]; then
              echo 'React runtime, CAPTCHA API, and Metrics Object API are ready.'
              exit 0
            fi

            if (( attempt % 12 == 0 )); then
              echo "Waiting: runtime=$runtime_ready captcha=$captcha_status metrics=$metrics_status"
              grep -i -E 'nexcent|client extension|batch|ERROR|Exception' \
                liferay-runtime.log | tail -n 120 || true
            fi

            sleep 5
          done

          echo 'Nexcent deployments did not become ready.'
          tail -n 500 liferay-runtime.log
          exit 1

      - name: Verify metric seed entries
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));
          const expected = new Set([
            'NXC_METRIC_MEMBERS',
            'NXC_METRIC_CLUBS',
            'NXC_METRIC_EVENT_BOOKINGS',
            'NXC_METRIC_PAYMENTS',
          ]);

          for (const item of response.items ?? []) {
            expected.delete(item.externalReferenceCode);
          }

          if (expected.size > 0) {
            throw new Error(`Missing metric seed entries: ${[...expected].join(', ')}`);
          }

          console.log('All four metric seed entries are available.');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke checks inside Liferay
        run: >-
          npx playwright test scripts/liferay-runtime.spec.ts
          --reporter=line
          --workers=1

      - name: Prepare downloadable setup artifact
        if: always()
        shell: bash
        run: |
          mkdir -p build/nexcent-full-setup/evidence
          cp liferay-runtime.log build/nexcent-full-setup/evidence/ 2>/dev/null || true
          cp nexcent-runtime.js build/nexcent-full-setup/evidence/ 2>/dev/null || true
          cp captcha.json build/nexcent-full-setup/evidence/ 2>/dev/null || true
          cp metrics.json build/nexcent-full-setup/evidence/ 2>/dev/null || true
          cp -R test-results build/nexcent-full-setup/evidence/ 2>/dev/null || true

          cat > build/nexcent-full-setup/README.txt <<EOF
          Nexcent full setup package
          ==========================
          Liferay product: $LIFERAY_PRODUCT
          Company web ID: $NEXCENT_WEB_ID
          Java: 21
          Node: 20.19.0

          Contents:
          - config/: unattended portal configuration
          - deploy/: all workspace artifacts staged by Gradle
          - evidence/: runtime logs and smoke-test responses
          - gradle.properties: workspace configuration snapshot
          - staged-deploy-files.txt: exact deploy manifest
          EOF

      - name: Upload full setup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: nexcent-dxp-2026-q2-8-full-setup
          path: |
            build/nexcent-full-setup
            playwright-report
            bundles/logs
            bundles/osgi/logs
          retention-days: 14

      - name: Stop Liferay
        if: always()
        run: |
          if [[ -f liferay-runtime.pid ]]; then
            kill "$(cat liferay-runtime.pid)" 2>/dev/null || true
          fi
