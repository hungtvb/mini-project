name: Nexcent Liferay Runtime Verification

on:
  push:
    branches:
      - refactor/nexcent-ui-boundary
    paths:
      - .github/workflows/nexcent-liferay-runtime.yml
      - client-extensions/nexcent-landing-elements/**
      - packages/nexcent-ui/**
      - scripts/liferay-runtime.spec.ts
      - package.json
      - package-lock.json
      - gradle.properties
      - settings.gradle
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: nexcent-liferay-runtime-${{ github.ref }}

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Clean Liferay runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      LIFERAY_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Nexcent UI and landing client extension
        run: |
          npm run typecheck --workspace @nexcent/ui
          npm run typecheck --workspace @nexcent/landing-elements
          npm run build --workspace @nexcent/landing-elements

      - name: Initialize clean Liferay DXP 2026.Q1.1 LTS bundle
        run: |
          sed -i 's/^liferay.workspace.product=.*/liferay.workspace.product=dxp-2026.q1.1-lts/' gradle.properties
          ./gradlew initBundle --no-daemon --stacktrace

      - name: Configure unattended local portal
        run: |
          cat > bundles/portal-ext.properties <<'EOF'
          company.default.locale=en_US
          company.default.name=Nexcent
          company.default.web.id=nexcent.com
          company.security.strangers=false
          default.admin.email.address.prefix=admin
          default.admin.first.name=Nexcent
          default.admin.last.name=Admin
          default.admin.password=learn
          setup.wizard.enabled=false
          terms.of.use.required=false
          users.reminder.queries.enabled=false
          EOF

      - name: Package and stage the client extension
        run: |
          ./gradlew :client-extensions:nexcent-landing-elements:deploy --no-daemon --stacktrace
          echo 'Files staged for Liferay deployment:'
          find bundles/deploy -maxdepth 2 -type f -print | sort

      - name: Start Liferay
        run: |
          nohup env \
            JAVA_OPTS='-Xms1g -Xmx3g -Dfile.encoding=UTF-8 -Duser.timezone=UTC' \
            bundles/tomcat/bin/catalina.sh run > liferay-runtime.log 2>&1 &
          echo $! > liferay-runtime.pid

      - name: Wait for portal startup
        run: |
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat liferay-runtime.pid)" 2>/dev/null; then
              echo 'Liferay process exited before startup.'
              tail -n 300 liferay-runtime.log
              exit 1
            fi

            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "$LIFERAY_BASE_URL/c/portal/login" || true)

            if [[ "$status" == '200' || "$status" == '302' || "$status" == '303' ]]; then
              echo "Liferay is accepting HTTP requests with status $status."
              exit 0
            fi

            if (( attempt % 12 == 0 )); then
              echo "Still waiting for Liferay (attempt $attempt, HTTP $status)..."
              tail -n 40 liferay-runtime.log || true
            fi

            sleep 10
          done

          echo 'Timed out waiting for Liferay.'
          tail -n 400 liferay-runtime.log
          exit 1

      - name: Wait for Nexcent global JS resource
        run: |
          candidates=(
            '/o/nexcent-react-runtime/index.js'
            '/o/nexcent-landing-elements/index.js'
          )

          for attempt in $(seq 1 120); do
            for path in "${candidates[@]}"; do
              if curl --fail --silent --show-error \
                "$LIFERAY_BASE_URL$path" \
                --output nexcent-runtime.js; then
                if grep -q 'nexcent-react-header' nexcent-runtime.js; then
                  echo "NEXCENT_RUNTIME_URL=$LIFERAY_BASE_URL$path" >> "$GITHUB_ENV"
                  echo "Nexcent runtime is available at $path."
                  exit 0
                fi
              fi
            done

            if (( attempt % 12 == 0 )); then
              echo "Still waiting for the Nexcent client extension (attempt $attempt)..."
              grep -i -E 'nexcent|client extension|ERROR|Exception' liferay-runtime.log | tail -n 80 || true
            fi

            sleep 5
          done

          echo 'Nexcent global JS resource was not published.'
          find bundles -maxdepth 5 -type f \
            \( -iname '*nexcent*' -o -iname '*client-extension*' \) -print | sort || true
          tail -n 400 liferay-runtime.log
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke checks inside Liferay
        run: >-
          npx playwright test scripts/liferay-runtime.spec.ts
          --reporter=line
          --workers=1

      - name: Upload Liferay runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: nexcent-liferay-runtime-evidence
          path: |
            liferay-runtime.log
            nexcent-runtime.js
            test-results
            playwright-report
            bundles/logs
            bundles/osgi/logs
          retention-days: 14

      - name: Stop Liferay
        if: always()
        run: |
          if [[ -f liferay-runtime.pid ]]; then
            kill "$(cat liferay-runtime.pid)" 2>/dev/null || true
          fi
